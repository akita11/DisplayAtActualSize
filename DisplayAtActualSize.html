<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>読み込んだ画像を実寸で表示するツール</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f0f0f0; }
        .controls { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .input-group { margin-bottom: 10px; }
        label { display: inline-block; width: 150px; }
        input[type="number"] { width: 80px; padding: 5px; }
        canvas { border: 1px solid #ccc; background-color: white; cursor: crosshair; max-width: 100%; }
        .info { color: #666; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>読み込んだ画像を実寸で表示するツール</h2>

    <div class="controls">
        <div class="input-group">
            <input type="file" id="fileInput" accept="image/png,application/pdf">
            <p class="info">※PDFはブラウザの仕様により1ページ目のみ画像として処理されます。</p>
        </div>
        <hr>
        <div class="input-group">
            <label>水平線の長さ (x):</label>
            <span id="pixelDist">0</span> px
        </div>
        <div class="input-group">
            <label>表示上の長さ (y):</label>
            <input type="number" id="valY" value="100"> mm
        </div>
        <div class="input-group">
            <label>実際の長さ (z):</label>
            <input type="number" id="valZ" value="200"> mm
        </div>
        <button id="resizeBtn">再描画（リサイズ）実行</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const pixelDistText = document.getElementById('pixelDist');
        const resizeBtn = document.getElementById('resizeBtn');

        let img = new Image();
        let startX, isDragging = false;
        let lineX1, lineX2, lineY;

        // 1. ファイル読み込み
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                img.src = event.target.result;
                img.onload = () => {
                    resetCanvas(img.width, img.height);
                };
            };
            reader.readAsDataURL(file);
        });

        function resetCanvas(width, height) {
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);
        }

        // 2. マウス操作で線を引く
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            startX = (e.clientX - rect.left) * (canvas.width / rect.width);
            lineY = (e.clientY - rect.top) * (canvas.height / rect.height);
            isDragging = true;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const currentX = (e.clientX - rect.left) * (canvas.width / rect.width);
            
            // 描画更新
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            ctx.beginPath();
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2;
            ctx.moveTo(startX, lineY);
            ctx.lineTo(currentX, lineY);
            ctx.stroke();

            const dist = Math.abs(currentX - startX);
            pixelDistText.innerText = Math.round(dist);
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const endX = (e.clientX - rect.left) * (canvas.width / rect.width);
            lineX1 = startX;
            lineX2 = endX;
            isDragging = false;
        });

        // 3. 再描画（リサイズ）ロジック
        resizeBtn.addEventListener('click', () => {
            const y = parseFloat(document.getElementById('valY').value);
            const z = parseFloat(document.getElementById('valZ').value);
            
            if (!y || !z || y === 0) {
                alert("有効な数値を入力してください");
                return;
            }

            // z / y の比率で画像を拡大縮小する
            const scaleFactor = z / y;
            const newWidth = img.width * scaleFactor;
            const newHeight = img.height * scaleFactor;

            // キャンバスをリサイズして画像を再描画
            canvas.width = newWidth;
            canvas.height = newHeight;
            ctx.drawImage(img, 0, 0, newWidth, newHeight);
            
            // 線情報をリセット
            pixelDistText.innerText = "0";
        // alert(`画像を ${scaleFactor.toFixed(2)} 倍にリサイズしました。`);
        });
    </script>
</body>
</html>
